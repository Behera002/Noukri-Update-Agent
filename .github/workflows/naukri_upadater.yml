
name: Naukri Profile Refresh Agent

on:
  schedule:
    # 08:30 AM IST
    - cron: '0 3 * * *'

    # 02:00 PM IST
    - cron: '30 8 * * *'

  workflow_dispatch:

jobs:
  update-profile:
    # runs-on: [self-hosted, Windows]     #ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Chrome Installation
        run: |
          google-chrome --version
          chromedriver --version || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Profile Updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          python naukri_update.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug-files
          path: |
            error.png
            upload_error.png
            upload_debug.html
            upload_result.png
          if-no-files-found: ignore
